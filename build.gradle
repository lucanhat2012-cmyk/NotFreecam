plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
    id 'maven-publish'
}

version = project.version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

sourceSets {
    main {
        java.srcDirs = ["src/client/java"]
        resources.srcDirs = ["src/client/resources"]
    }
}

repositories {
    maven { name = 'Terraformers'; url = 'https://maven.terraformersmc.com/' }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
    compileOnly "com.terraformersmc:modmenu:21.0.1"
}

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") { expand "version": project.version }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 25
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

// Create the small camera emblem used by Mod Menu and the mod list.
def generatedIcon = layout.projectDirectory.file("src/client/resources/assets/notfreecam/icon.png")

tasks.register("generateModIcon") {
    outputs.file(generatedIcon)
    doLast {
        def file = generatedIcon.asFile
        file.parentFile.mkdirs()
        def image = new java.awt.image.BufferedImage(64, 64, java.awt.image.BufferedImage.TYPE_INT_ARGB)
        def g = image.createGraphics()
        g.setRenderingHint(java.awt.RenderingHints.KEY_ANTIALIASING, java.awt.RenderingHints.VALUE_ANTIALIAS_ON)
        g.setColor(new java.awt.Color(17, 12, 35))
        g.fillRoundRect(0, 0, 64, 64, 12, 12)
        g.setColor(new java.awt.Color(147, 55, 255))
        g.setStroke(new java.awt.BasicStroke(4f, java.awt.BasicStroke.CAP_ROUND, java.awt.BasicStroke.JOIN_ROUND))
        g.drawArc(4, 8, 56, 48, 205, 245)
        g.setColor(new java.awt.Color(80, 48, 130))
        g.fillRoundRect(10, 20, 43, 29, 7, 7)
        g.setColor(new java.awt.Color(185, 175, 205))
        g.fillRoundRect(16, 15, 25, 10, 4, 4)
        g.setColor(new java.awt.Color(35, 30, 49))
        g.fillOval(27, 22, 23, 23)
        g.setColor(new java.awt.Color(166, 77, 255))
        g.fillOval(31, 26, 15, 15)
        g.setColor(new java.awt.Color(230, 210, 255))
        g.fillOval(35, 29, 5, 5)
        g.dispose()
        javax.imageio.ImageIO.write(image, "png", file)
    }
}

tasks.withType(org.gradle.language.jvm.tasks.ProcessResources).configureEach {
    dependsOn(tasks.named("generateModIcon"))
}

jar {
    from("LICENSE") { rename { "${it}_notfreecam" } }
}
